version: 2.1
jobs:
  verify:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Record revision and assert clean checkout
          command: |
            set -eu
            printf 'CIRCLE_SHA1=%s\n' "${CIRCLE_SHA1:-unknown}"
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            test -z "$(git status --porcelain)"
      - run:
          name: Check patch whitespace
          command: |
            set -eu
            git diff --check HEAD^ HEAD
      - run:
          name: Run unittest suite with ResourceWarning as ERROR (strict)
          command: |
            set -eu
            PYTHONDONTWRITEBYTECODE=1 python -W error::ResourceWarning -m unittest discover -s tests -v
      - run:
          name: Verify HG Native Intelligence V2.1 fixture inventory and checksums
          command: |
            set -eu
            cd tests/fixtures/hg-native-intelligence-v2.1
            python validate_v21.py
            sha256sum -c SHA256SUMS-V2.1.txt
      - run:
          name: Validate separate HNI-30 oracle binding (design-only; runtime not approved)
          command: |
            set -eu
            PYTHONDONTWRITEBYTECODE=1 python scripts/hg-hni30-evaluate --validate-oracle > /tmp/hni30-oracle-validation.json
            python -c "import json; r=json.load(open('/tmp/hni30-oracle-validation.json', encoding='utf-8')); assert r['valid'] is True; assert r['criterion_count'] == 30; assert r['runtime_approval'] == 'NOT_APPROVED'; assert r['runtime_execution'] == 'NOT_RUN'; print('HNI30 oracle valid: 30 criteria; runtime NOT_APPROVED/NOT_RUN')"
      - run:
          name: Run version-pinned HG-native deterministic oracle suite
          command: |
            set -eu
            PYTHONDONTWRITEBYTECODE=1 python scripts/hg-native-oracle /tmp/hg-native-oracle-ci.json
      - run:
          name: Run synthetic baseline-candidate control-policy benchmark
          command: |
            set -eu
            PYTHONDONTWRITEBYTECODE=1 python scripts/hg-native-benchmark > /tmp/hg-native-benchmark.json
            python -c "import json; r=json.load(open('/tmp/hg-native-benchmark.json', encoding='utf-8')); assert r['observed_model_runs'] == 0; assert r['acceptance']['accepted'] is True; assert r['regressions'] == []; assert r['delta_pass_rate'] >= r['acceptance']['predeclared_minimum_delta']; print(json.dumps({k:r[k] for k in ('classification','delta_pass_rate','paired_cases_improved','regressions','production_acceptance')}, sort_keys=True))"
workflows:
  hg2-p0-strict-verify:
    jobs:
      - verify
