version: 2.1
jobs:
  verify:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Record revision and assert clean checkout
          command: |
            set -eu
            printf 'CIRCLE_SHA1=%s\n' "${CIRCLE_SHA1:-unknown}"
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            test -z "$(git status --porcelain)"
      - run:
          name: Check patch whitespace
          command: |
            set -eu
            git diff --check HEAD^ HEAD
      - run:
          name: Build allowlisted HG2 distribution
          command: |
            set -eu
            DIST_DIR="/tmp/hg2-distribution"
            mkdir -p "$DIST_DIR"
            PYTHONDONTWRITEBYTECODE=1 python tools/build_distribution.py \
              --output "$DIST_DIR/hg2.zip"
      - store_artifacts:
          path: /tmp/hg2-distribution
          destination: hg2-distribution
      - run:
          name: Bind exact candidate, test run, and local evidence
          command: |
            set -eu
            EVIDENCE_DIR="/tmp/hg2-provenance"
            mkdir -p "$EVIDENCE_DIR"
            PYTHONDONTWRITEBYTECODE=1 python tools/hg_provenance.py snapshot \
              --repo . --repository-identity OAI-GIANG/HG2 \
              --output "$EVIDENCE_DIR/candidate-manifest.json"
            PYTHONDONTWRITEBYTECODE=1 python tools/hg_provenance.py verify \
              --repo . --manifest "$EVIDENCE_DIR/candidate-manifest.json"
            PYTHONDONTWRITEBYTECODE=1 python tools/hg_provenance.py run \
              --repo . --manifest "$EVIDENCE_DIR/candidate-manifest.json" \
              --out-dir "$EVIDENCE_DIR/test-run" -- \
              env PYTHONDONTWRITEBYTECODE=1 python -W error::ResourceWarning \
              -m unittest discover -s tests -v
          teardown:
            - store_artifacts:
                path: /tmp/hg2-provenance
                destination: hg2-provenance
workflows:
  hg2-p0-strict-verify:
    jobs:
      - verify
