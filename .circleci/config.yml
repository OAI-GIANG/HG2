version: 2.1
jobs:
  verify:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Record revision and assert clean checkout
          command: |
            set -eu
            printf 'CIRCLE_SHA1=%s\n' "${CIRCLE_SHA1:-unknown}"
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            test -z "$(git status --porcelain)"
      - run:
          name: Check patch whitespace
          command: |
            set -eu
            git diff --check HEAD^ HEAD
      - run:
          name: Run unittest suite with ResourceWarning as ERROR (strict)
          command: |
            set -eu
            PYTHONDONTWRITEBYTECODE=1 python -W error::ResourceWarning -m unittest discover -s tests -v
      - run:
          name: Verify HG Native Intelligence V2.1 fixture inventory and checksums
          command: |
            set -eu
            cd tests/fixtures/hg-native-intelligence-v2.1
            python validate_v21.py
            sha256sum -c SHA256SUMS-V2.1.txt
      - run:
          name: Validate cleanup decision matrix is present
          command: |
            set -eu
            python -c 'from pathlib import Path; p=Path("docs/HG2_CLEANUP_DECISION_MATRIX_20261018.md"); s=p.read_text(encoding="utf-8"); assert "## Pull-request disposition" in s; assert "CLEANUP_STATUS=PARTIAL_COMPLETION" in s'
workflows:
  hg2-p0-strict-verify:
    jobs:
      - verify
